[package]
name = "recall-studio"
version = "0.1.0"
description = "Session memory for Ableton Live"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recall_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
crc32fast = "1"
# Ableton writes .als as gzipped XML. Reading a saved set back is the only way to
# recover a plugin preset NAME: Live's own preset fields are empty for every VST3
# and the LOM reports a single dummy program, so the name only survives inside the
# state blob the plugin hands Live to store. See als_presets.rs.
flate2 = "1"
# std::net::UdpSocket exposes no SO_RCVBUF setter, and the OS default (~64KB on
# Windows) is what makes a project-load snapshot burst lose packets in the kernel
# before our code ever sees them. socket2 is the boring, proven way to size it —
# it is what tokio/mio use underneath.
socket2 = "0.5"
tauri-plugin-notification = "2.3.3"
# Used directly for the daily-plan toast so Recall can react when its body is clicked.
notify-rust = "4.18.0"

# Serum 2 does not publish its current preset name through Ableton's Live Object
# Model. On Windows the name is still visible in Serum's own editor, so Recall
# reads only that small label using documented window capture + built-in OCR.
# This stays completely outside the Remote Script parameter-listener path.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
