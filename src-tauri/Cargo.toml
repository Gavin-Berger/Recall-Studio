[package]
name = "recall-studio"
version = "0.1.0"
description = "Session memory for Ableton Live"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recall_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
crc32fast = "1"
# std::net::UdpSocket exposes no SO_RCVBUF setter, and the OS default (~64KB on
# Windows) is what makes a project-load snapshot burst lose packets in the kernel
# before our code ever sees them. socket2 is the boring, proven way to size it —
# it is what tokio/mio use underneath.
socket2 = "0.5"
tauri-plugin-notification = "2.3.3"
# Used directly for the daily-plan toast so Recall can react when its body is clicked.
notify-rust = "4.18.0"
